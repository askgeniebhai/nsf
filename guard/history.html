<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My History | NSF</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        .sidebar { width: 260px; background: #0B1F3A; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header img { height: 40px; margin-bottom: 10px; }
        .sidebar-menu { flex: 1; padding: 20px 0; }
        .menu-link { display: flex; align-items: center; gap: 15px; padding: 12px 30px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; background: none; border: none; width: 100%; text-align: left; font-family: inherit; cursor: pointer; transition: all 0.2s; }
        .menu-link:hover, .menu-link.active { color: white; background: rgba(212, 175, 55, 0.1); }
        .menu-link.active { border-left: 4px solid #D4AF37; color: #D4AF37; }
        .menu-link i { width: 18px; height: 18px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-nav { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; flex-shrink: 0; }
        .content-body { padding: 20px; }
        .g-container { max-width: 600px; margin: 0 auto; }
        .history-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .history-item:last-child { border-bottom: none; }
        .history-type { font-weight: 700; font-size: 14px; }
        .history-time { font-size: 12px; color: #64748b; }

        @media (max-width: 1024px) {
            body { display: block; height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
            .sidebar { width: 100%; }
            .sidebar-menu { display: flex; overflow-x: auto; padding: 10px; }
            .menu-link { flex: 0 0 auto; width: auto; padding: 10px 14px; }
            .main-content { min-width: 0; }
            .top-nav { height: auto; min-height: 64px; padding: 16px 20px; gap: 12px; flex-wrap: wrap; }
            .content-body { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div class="top-nav"></div>

    <div class="content-body">
    <div class="g-container" id="history-container">
        <!-- Dynamic -->
    </div>
    </div>
</div>

<script src="../js/StorageService.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui-components.js"></script>
<script>
    const user = AuthService.checkAuth('guard');
    UI.renderSidebar('history');
    UI.renderTopNav('My Attendance History');
    function renderHistory() {
        const logs = StorageService.load('nsf_attendance_logs', []).filter(l => l.userId === user.id);
        const container = document.getElementById('history-container');

        if (logs.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:40px; color:#64748b;">No records found.</p>';
            return;
        }

        // Group by date
        const groups = {};
        logs.forEach(l => {
            const date = new Date(l.timestamp).toLocaleDateString();
            if (!groups[date]) groups[date] = [];
            groups[date].push(l);
        });

        container.innerHTML = Object.keys(groups).sort((a,b) => new Date(b) - new Date(a)).map(date => `
            <div class="history-card">
                <h3 style="font-size: 14px; margin-top:0; color:#0B1F3A; border-bottom:1px solid #eee; padding-bottom:10px;">${date}</h3>
                ${groups[date].map(l => `
                    <div class="history-item">
                        <div>
                            <div class="history-type" style="color:${l.type==='Check In'?'#059669':'#dc2626'}">${l.type}</div>
                            <div class="history-time">${new Date(l.timestamp).toLocaleTimeString()}</div>
                        </div>
                        <div style="text-align:right; font-size:11px; color:#64748b;">
                            <i data-lucide="map-pin" class="icon-sm"></i> ${l.site}
                        </div>
                    </div>
                `).join('')}
            </div>
        `).join('');
        lucide.createIcons();
    }
    renderHistory();
</script>
</body>
</html>
