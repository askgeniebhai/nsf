<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guard Dashboard | NSF</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        .sidebar { width: 260px; background: #0B1F3A; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header img { height: 40px; margin-bottom: 10px; }
        .sidebar-menu { flex: 1; padding: 20px 0; }
        .menu-link { display: flex; align-items: center; gap: 15px; padding: 12px 30px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; background: none; border: none; width: 100%; text-align: left; font-family: inherit; cursor: pointer; transition: all 0.2s; }
        .menu-link:hover, .menu-link.active { color: white; background: rgba(212, 175, 55, 0.1); }
        .menu-link.active { border-left: 4px solid #D4AF37; color: #D4AF37; }
        .menu-link i { width: 18px; height: 18px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-nav { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; flex-shrink: 0; }
        .content-body { padding: 20px; }
        .g-container { max-width: 600px; margin: 0 auto; }
        .g-card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .profile-section { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 60px; height: 60px; background: #D4AF37; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0B1F3A; font-weight: 700; font-size: 24px; }
        .info h2 { font-size: 18px; margin: 0; }
        .info p { font-size: 14px; color: #64748b; margin: 0; }
        .assignment-badge { display: inline-block; padding: 4px 12px; background: #e0f2fe; color: #0369a1; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 5px; }
        .g-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; text-decoration: none; color: inherit; }
        .menu-item:active { transform: scale(0.95); }
        .menu-item i { width: 32px; height: 32px; color: #0B1F3A; margin-bottom: 10px; }
        .menu-item span { display: block; font-size: 14px; font-weight: 600; }

        @media (max-width: 1024px) {
            body { display: block; height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
            .sidebar { width: 100%; }
            .sidebar-menu { display: flex; overflow-x: auto; padding: 10px; }
            .menu-link { flex: 0 0 auto; width: auto; padding: 10px 14px; }
            .main-content { min-width: 0; }
            .top-nav { height: auto; min-height: 64px; padding: 16px 20px; gap: 12px; flex-wrap: wrap; }
            .content-body { padding: 16px; }
            .g-menu { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 390px) {
            .profile-section { align-items: flex-start; gap: 14px; }
            .g-menu { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0B1F3A">
    <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
    <script src="/js/pwa.js" defer></script>
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div class="top-nav"></div>

    <div class="content-body">
    <div class="g-container">
    <div class="g-card">
        <div class="profile-section">
            <div class="avatar" id="g-initials">JS</div>
            <div class="info">
                <h2 id="g-name">John Smith</h2>
                <p id="g-id">ID: NFS-9921</p>
                <div class="assignment-badge">Tech Park Alpha • Day Shift</div>
            </div>
        </div>
    </div>

    <div class="g-menu">
        <a href="attendance.html" class="menu-item">
            <i data-lucide="map-pin"></i>
            <span>Mark Attendance</span>
        </a>
        <a href="history.html" class="menu-item">
            <i data-lucide="calendar"></i>
            <span>My History</span>
        </a>
        <a href="patrol.html" class="menu-item">
            <i data-lucide="route"></i>
            <span>Patrol Log</span>
        </a>
        <a href="incidents.html" class="menu-item">
            <i data-lucide="alert-triangle"></i>
            <span>Report Incident</span>
        </a>
    </div>

    <div class="g-card" style="margin-top: 20px;">
        <h3 style="font-size: 16px; margin-bottom: 15px;">Today's Schedule</h3>
        <p style="font-size: 14px; margin-bottom: 8px;"><i data-lucide="clock" class="icon-sm"></i> 08:00 AM - 08:00 PM</p>
        <p style="font-size: 14px;"><i data-lucide="map-pin" class="icon-sm"></i> Gate 4, Tech Park Alpha</p>
    </div>
    </div>
    </div>
</div>

<script src="../js/StorageService.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui-components.js"></script>
<script>
    const user = AuthService.checkAuth('guard');
    UI.renderSidebar('dashboard');
    UI.renderTopNav('Guard Dashboard');
    if (user) {
        document.getElementById('g-name').textContent = user.name;
        document.getElementById('g-id').textContent = 'ID: ' + user.id;
        document.getElementById('g-initials').textContent = user.name.split(' ').map(n => n[0]).join('');
    }
    lucide.createIcons();
</script>
</body>
</html>
