<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Portal | NSF</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        .sidebar { width: 260px; background: #0B1F3A; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header img { height: 40px; margin-bottom: 10px; }
        .sidebar-menu { flex: 1; padding: 20px 0; }
        .menu-link { display: flex; align-items: center; gap: 15px; width: 100%; padding: 12px 30px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; font-family: inherit; background: none; border: none; text-align: left; cursor: pointer; transition: all 0.2s; }
        .menu-link:hover, .menu-link.active { color: white; background: rgba(212, 175, 55, 0.1); }
        .menu-link.active { border-left: 4px solid #D4AF37; color: #D4AF37; }
        .menu-link i { width: 18px; height: 18px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .s-topnav { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; flex-shrink: 0; }
        .s-container { padding: 40px; max-width: 1200px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .p-table-wrap { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); overflow: hidden; }
        .p-table { width: 100%; border-collapse: collapse; text-align: left; }
        .p-table th { background: #f8fafc; padding: 15px 25px; font-size: 11px; text-transform: uppercase; color: #64748b; }
        .p-table td { padding: 15px 25px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }

        .p-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .p-badge.present { background: #ecfdf5; color: #059669; }
        .p-badge.pending { background: #fffbeb; color: #d97706; }

        @media (max-width: 1024px) {
            body { display: block; height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
            .sidebar { width: 100%; }
            .sidebar-menu { display: flex; overflow-x: auto; padding: 10px; }
            .menu-link { flex: 0 0 auto; width: auto; padding: 10px 14px; }
            .main-content { min-width: 0; }
            .s-topnav { height: auto; min-height: 64px; padding: 16px 20px; gap: 12px; flex-wrap: wrap; }
            .s-container { padding: 24px 16px; }
        }
    </style>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0B1F3A">
    <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
    <script src="/js/pwa.js" defer></script>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <img src="../assets/images/logo.png" alt="Logo">
        <p style="font-size: 10px; color: #D4AF37; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Supervisor Portal</p>
    </div>
    <div class="sidebar-menu">
        <button class="menu-link active" id="nav-dashboard" onclick="showTab('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</button>
        <button class="menu-link" id="nav-attendance" onclick="showTab('attendance')"><i data-lucide="calendar"></i> Live Attendance</button>
    </div>
    <div style="padding: 20px;">
        <button onclick="AuthService.logout()" class="menu-link" style="color: rgba(255,255,255,0.7);">
            <i data-lucide="log-out"></i> Logout
        </button>
    </div>
</div>

<div class="main-content">
    <div class="s-topnav">
        <h2 style="font-size: 18px; color: #0B1F3A; margin:0;">Supervisor Control Panel</h2>
        <span id="s-name" style="font-size: 14px; font-weight: 500; color:#0B1F3A;">Supervisor User</span>
    </div>

    <div class="s-container">
        <div id="tab-dashboard" class="tab-content active">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px;">
                <div class="p-table-wrap" style="padding: 25px; text-align: center;">
                    <h4 style="font-size: 12px; text-transform: uppercase; color: #64748b;">Total Reporting</h4>
                    <p id="s-total-guards" style="font-size: 32px; font-weight: 700; margin: 10px 0;">6</p>
                </div>
                <div class="p-table-wrap" style="padding: 25px; text-align: center;">
                    <h4 style="font-size: 12px; text-transform: uppercase; color: #64748b;">Present</h4>
                    <p id="s-present-guards" style="font-size: 32px; font-weight: 700; color: #059669; margin: 10px 0;">0</p>
                </div>
                <div class="p-table-wrap" style="padding: 25px; text-align: center;">
                    <h4 style="font-size: 12px; text-transform: uppercase; color: #64748b;">Missing</h4>
                    <p id="s-absent-guards" style="font-size: 32px; font-weight: 700; color: #dc2626; margin: 10px 0;">6</p>
                </div>
            </div>
        </div>

        <div id="tab-attendance" class="tab-content">
            <div class="p-table-wrap">
                <table class="p-table">
                    <thead>
                        <tr>
                            <th>Guard</th>
                            <th>Status</th>
                            <th>In Time</th>
                            <th>Out Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="s-attendance-list">
                        <!-- Dynamic -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="../js/StorageService.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/auth.js"></script>
<script>
    AuthService.checkAuth('supervisor');

    const employees = StorageService.load('nsf_employees', []);

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.sidebar-menu .menu-link').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        if(id === 'attendance') renderAttendance();
    }

    function renderAttendance() {
        const logs = StorageService.load('nsf_attendance_logs', []);
        const list = document.getElementById('s-attendance-list');

        list.innerHTML = employees.map(emp => {
            const inLog = logs.find(l => l.userId === emp.id && l.type === 'Check In');
            const outLog = logs.find(l => l.userId === emp.id && l.type === 'Check Out');
            const status = inLog ? (outLog ? 'Completed' : 'On Duty') : 'Pending';

            return `
                <tr>
                    <td><strong>${emp.name}</strong><br><small>${emp.id}</small></td>
                    <td><span class="p-badge ${inLog ? 'present' : 'pending'}">${status}</span></td>
                    <td>${inLog ? new Date(inLog.timestamp).toLocaleTimeString() : '--'}</td>
                    <td>${outLog ? new Date(outLog.timestamp).toLocaleTimeString() : '--'}</td>
                    <td><button style="background:#0B1F3A; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:11px; cursor:pointer;">Manual Mark</button></td>
                </tr>
            `;
        }).join('');
    }

    lucide.createIcons();
</script>
</body>
</html>
