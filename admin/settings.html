<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | NSF Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #0B1F3A; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .sidebar-header img { height: 40px; margin-bottom: 10px; }
        .sidebar-menu { flex: 1; padding: 20px 0; }
        .menu-link { display: flex; align-items: center; gap: 15px; padding: 12px 30px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .menu-link:hover, .menu-link.active { color: white; background: rgba(212, 175, 55, 0.1); }
        .menu-link.active { border-left: 4px solid #D4AF37; color: #D4AF37; }
        .menu-link i { width: 18px; height: 18px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-nav { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .content-body { padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; }
        @media (max-width: 1024px) {
            body { display: block; height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
            .sidebar { width: 100%; }
            .sidebar-menu { display: flex; overflow-x: auto; padding: 10px; }
            .menu-link { flex: 0 0 auto; padding: 10px 14px; }
            .main-content { min-width: 0; }
            .top-nav { height: auto; min-height: 64px; padding: 16px 20px; gap: 12px; }
            .content-body { padding: 24px 16px; }
        }
    </style>
</head>
<body>
    <div class="sidebar"></div>
    <div class="main-content">
        <div class="top-nav"></div>
        <div class="content-body">
            <div class="card">
                <h3>General Settings</h3>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" value="Neela Security Force">
                </div>
                <div class="form-group">
                    <label>Attendance Radius (meters)</label>
                    <input type="number" value="500">
                </div>
                <div class="form-group">
                    <label>Admin Notification Email</label>
                    <input type="email" value="admin@neelasecurity.com">
                </div>
                <button class="btn btn-gold" onclick="alert('Settings Saved!')">Save Changes</button>
            </div>
        </div>
    </div>
    <script src="../js/StorageService.js"></script>
    <script src="../js/seed.js"></script>
<script src="../js/auth.js"></script>
    <script src="../js/ui-components.js"></script>
    <script>
        AuthService.checkAuth('admin');
        UI.renderSidebar('settings');
        UI.renderTopNav('System Settings');
    </script>
</body>
</html>
