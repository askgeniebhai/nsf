<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | NSF</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; display: flex; height: 100vh; overflow: hidden; margin: 0; }
        .sidebar { width: 260px; background: #0B1F3A; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar-header img { height: 40px; margin-bottom: 10px; }
        .sidebar-menu { flex: 1; padding: 20px 0; }
        .menu-link { display: flex; align-items: center; gap: 15px; padding: 12px 30px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; background: none; border: none; width: 100%; text-align: left; font-family: inherit; cursor: pointer; transition: all 0.2s; }
        .menu-link:hover, .menu-link.active { color: white; background: rgba(212, 175, 55, 0.1); }
        .menu-link.active { border-left: 4px solid #D4AF37; color: #D4AF37; }
        .menu-link i { width: 18px; height: 18px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-nav { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; flex-shrink: 0; }
        .c-container { padding: 40px; max-width: 1000px; }
        .client-welcome { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table th { text-align: left; font-size: 11px; text-transform: uppercase; color: #64748b; padding: 10px 0; border-bottom: 2px solid #f1f5f9; }
        .table td { padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }

        @media (max-width: 1024px) {
            body { display: block; height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
            .sidebar { width: 100%; }
            .sidebar-menu { display: flex; overflow-x: auto; padding: 10px; }
            .menu-link { flex: 0 0 auto; width: auto; padding: 10px 14px; }
            .main-content { min-width: 0; }
            .top-nav { height: auto; min-height: 64px; padding: 16px 20px; gap: 12px; flex-wrap: wrap; }
            .c-container { padding: 24px 16px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
    <div class="top-nav"></div>

    <div class="c-container">
    <div class="client-welcome">
        <h1 style="margin-top: 0; font-size: 24px;">Welcome, Tech Park Alpha</h1>
        <p style="color: #64748b; font-size: 16px;">Overview of security operations at your site.</p>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Current Guard Deployment</h3>
            <table class="table">
                <thead>
                    <tr><th>Name</th><th>Shift</th><th>Status</th></tr>
                </thead>
                <tbody id="deployment-list">
                    <tr><td colspan="3" style="text-align:center; padding:20px; color:#64748b;">No deployment data available.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card">
            <h3>Recent Reports</h3>
            <ul style="list-style: none; padding: 0;">
                <li style="padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between;">
                    <span>Daily Attendance - July 05</span>
                    <a href="#" style="color: #D4AF37; font-size: 12px; font-weight: 600;">Download PDF</a>
                </li>
                <li style="padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between;">
                    <span>Monthly Summary - June</span>
                    <a href="#" style="color: #D4AF37; font-size: 12px; font-weight: 600;">Download PDF</a>
                </li>
            </ul>
        </div>
    </div>
    </div>
</div>

<script src="../js/StorageService.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui-components.js"></script>
<script>
    AuthService.checkAuth('client');
    UI.renderSidebar('dashboard');
    UI.renderTopNav('Client Portal');
    lucide.createIcons();
</script>
</body>
</html>
